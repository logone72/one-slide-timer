name: Verify

on:
  pull_request:
  workflow_call:
    inputs:
      upload-pages:
        description: 검증한 빌드를 Pages 배포용으로 업로드
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm exec -- playwright install --with-deps chromium webkit
      - run: npm run verify
      - run: npm run verify:browser
      # 전체 기능 검사를 통과한 뒤 실제 배포 경로의 산출물도 검사한다.
      - name: Build and check Pages
        env:
          PAGES_BASE_PATH: /${{ github.event.repository.name }}/
        run: |
          npm run build
          npm run test:browser -- tests/browser/pages.spec.ts --project=desktop-chromium
      - uses: actions/upload-pages-artifact@v5
        if: inputs.upload-pages == true && github.ref == 'refs/heads/main'
        with:
          path: dist
